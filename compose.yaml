name: estatehub

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build: ./EstateHub_final
    ports:
      - "127.0.0.1:${ESTATEHUB_PORT:-18081}:8080"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging
    networks: [app]

  api:
    build: "./estatehub(Backend)"
    environment:
      DB_URL: jdbc:mysql://db:3306/estatehub
      DB_USERNAME: estatehub
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks: [app, data]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: estatehub
      MYSQL_USER: estatehub
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    networks: [data]

networks:
  app:
  data:
    internal: true

volumes:
  mysql:
  uploads:
