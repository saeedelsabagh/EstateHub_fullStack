name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start the demo stack
        run: bash deploy/deploy.sh

      - name: Check the frontend and property API
        run: |
          curl --retry 20 --retry-delay 3 --retry-all-errors -fsS http://127.0.0.1:18081/ > /dev/null
          curl --retry 20 --retry-delay 3 --retry-all-errors -fsS http://127.0.0.1:18081/api/property | jq -e 'type == "array"'
          curl -fsS http://127.0.0.1:18081/api/users/stats | jq -e '.clients == 0 and .agents == 0'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/users)" = 403

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Remove the temporary stack
        if: always()
        run: docker compose down --volumes
